set -gF @tmux_config_dir '#{d:current_file}'

bind-key "K" run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux center,55%,60% \
    --ansi \
    --no-sort --prompt '> ' \
    --color 'bg:#282828,bg+:#3c3836,fg:#89b4fa,fg+:#89b4fa' \
    --color 'hl:#fabd2f,hl+:#fabd2f,info:#83a598,marker:#8ec07c' \
    --color 'prompt:#d79921,spinner:#8ec07c,pointer:#fe8019,header:#928374' \
    --color 'border:#928374,label:#ebdbb2,query:#ebdbb2'
)\""

# colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ',ghostty*:RGB'
set -g cursor-style blinking-bar

# Basic
set -g allow-passthrough on
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g history-limit 20000
set -g mouse on
set -g renumber-windows on
set -g set-clipboard on
set -g window-size largest

# Don't switch windows when scrolling the mouse wheel over the status bar
unbind -n WheelUpStatus
unbind -n WheelDownStatus

# Enable extended keys for proper modifier key support
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Vim mode
# enter with <leader>[
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi P send-keys -X copy-pipe-and-cancel "#{@tmux_config_dir}/pi-send"

# key binding
bind - split-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind C new-window -b -c '#{pane_current_path}'
# Pane/split navigation shared with nvim: nvim/plugin/keymap.lua binds the same
# keys and hands them back here at a split edge. The π branch targets pi's pane
# by title, since it runs nvim as a child on the same tty and the is_nvim probe
# below would otherwise be true and the key would disappear into it.
# The regex avoids \S and \/ on purpose: tmux passes backslashes through to the
# shell doubled, so `(\S+\/)?` reaches grep as a literal-backslash class that
# never matches. `comm` is a full path here (nvim runs from a mise install dir),
# so a broken path-prefix group made this probe always false, and every C-hjkl
# was answered with select-pane instead of being forwarded to nvim.
is_nvim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell -F '#{m/r:^π,#{pane_title}}' 'select-pane -L' "if-shell \"$is_nvim\" 'send-keys C-h' 'select-pane -L'"
bind-key -n C-j if-shell -F '#{m/r:^π,#{pane_title}}' 'select-pane -D' "if-shell \"$is_nvim\" 'send-keys C-j' 'select-pane -D'"
bind-key -n C-k if-shell -F '#{m/r:^π,#{pane_title}}' 'select-pane -U' "if-shell \"$is_nvim\" 'send-keys C-k' 'select-pane -U'"
bind-key -n C-l if-shell -F '#{m/r:^π,#{pane_title}}' 'select-pane -R' "if-shell \"$is_nvim\" 'send-keys C-l' 'select-pane -R'"
bind-key -n 'C-\' if-shell -F '#{m/r:^π,#{pane_title}}' 'select-pane -l' "if-shell \"$is_nvim\" 'send-keys C-\\\\' 'select-pane -l'"
bind-key -n C-Space if-shell -F '#{m/r:^π,#{pane_title}}' 'select-pane -t:.+' "if-shell \"$is_nvim\" 'send-keys C-Space' 'select-pane -t:.+'"

# Copy mode swallows the bindings above, so navigation there moves panes only.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi C-Space select-pane -t:.+

# <prefix> C-l still clears the screen, since C-l is taken above.
bind-key C-l send-keys 'C-l'
bind-key z command-prompt -I '#S' 'rename-session '%%''
bind-key r command-prompt -I '#W' 'rename-window '%%''
bind-key -n Home send Escape 'OH'
bind-key -n End send Escape 'OF'
bind-key o split-window -h -p 65 'echo -n "$(date +%Y-%m-%d-)" | pbcopy && cd "$OBSIDIAN_VAULT" && nvim'

# Kill without the upstream confirm-before prompt. Both keys close only the
# current pane; tmux drops the window by itself once its last pane is gone, so
# nothing here can take a whole window's worth of panes at once.
bind-key & kill-pane
bind-key x kill-pane

# lazygit
bind-key l display-popup -w 100% -h 100% -d '#{pane_current_path}' -E lazygit

# Theme
set -g status-position top
set -g status-left-length 50

set -g @custom_bg '#282828'
set -g @custom_fg '#ebdbb2'
set -g @custom_gray '#928374'
set -g @custom_dark_gray '#3c3836'
set -g @custom_red '#fb4934'
set -g @custom_yellow '#fabd2f'
set -g @custom_orange '#d79921'
set -g @custom_lavender '#b4befe'
set -g @custom_surface '#504945'

# Status bar
set -g status-style "bg=default,fg=#{@custom_fg}"
set -g status-right-length 100
set -g status-left "#[fg=#{?client_prefix,#{@custom_red},#{@custom_orange}},bg=#{@custom_bg}][#S] "
set -g status-right "#[fg=#{@custom_yellow},bg=#{@custom_bg}] %Y-%m-%d %H:%M "

# Window status — pi/p show as π when tmux's automatic-rename is still live
# (a manual rename via prefix+r turns automatic-rename off for that window,
# so #W then wins instead).
set -g window-status-format "#[fg=#{@custom_gray},bg=default] #I #[fg=#{@custom_fg},bg=default]#{?automatic-rename,#{s/^pi$/π/:pane_current_command},#W} "
set -g window-status-current-format "#[fg=#{@custom_bg},bg=#{@custom_lavender}] #I:#{?automatic-rename,#{s/^pi$/π/:pane_current_command},#W} "

# Pane borders
set -g pane-border-style "fg=#{@custom_surface}"
set -g pane-active-border-style "fg=#{@custom_lavender}"

# Selection style
set -g mode-style "bg=#{@custom_surface},fg=#{@custom_fg}"

# Messages
set -g message-style "bg=#{@custom_dark_gray},fg=#{@custom_yellow}"
set -g message-command-style "bg=#{@custom_dark_gray},fg=#{@custom_yellow}"

bind-key u run-shell -b 'urls=$(tmux capture-pane -J -p | perl -0777 -pe '"'"'s/([A-Za-z0-9+&@#\/%?=~_|!:,.;-])[ \t]*\n[ \t]+([A-Za-z0-9+&@#\/%?=~_|!:,.;-])/$1$2/g'"'"' | grep -oE "(https?|ftp|file):/?//[-A-Za-z0-9+&@#/%?=~_|!:,.;]*[-A-Za-z0-9+&@#/%=~_|]" | tail -r); [ -n "$urls" ] || exit 0; choice=$(printf "%s\n" "$urls" | fzf --tmux 35% -m --no-preview --no-border); [ -n "$choice" ] || exit 0; printf "%s\n" "$choice" | while IFS= read -r url; do open "$url"; done'

# Send to pi: selection in copy mode (prefix + P), full pane otherwise
bind-key P run-shell -b "#{@tmux_config_dir}/pi-send -p #{pane_id}"
