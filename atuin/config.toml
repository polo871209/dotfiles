search_mode = "daemon-fuzzy"
enter_accept = true

history_filter = [
	"^cls$",
	"^clear$",
	"^ls$",
	"^ls -la?$",
	"^cd$",
	"^cd \\.\\.$",
	"^cd -$",
	"^pwd$",
	"^z$",
	"^.{1,3}$",
]

[daemon]
enabled = true
autostart = true

[search]
filters = ["global", "workspace"]

[ui]
columns = ["exit", "duration", "time", "command"]

[ai]
enabled = false

[keymap.emacs]
"left" = [
	{ when = "cursor-at-start", action = "copy" },
	{ action = "cursor-left" },
]
