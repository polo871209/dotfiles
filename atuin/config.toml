search_mode = "daemon-fuzzy"
# The zsh-autosuggestions hint is a prefix search, so the up arrow uses one too and selects the hint first.
search_mode_shell_up_key_binding = "prefix"
enter_accept = true

history_filter = [
	"^cls$",
	"^clear$",
	"^ls$",
	"^ls -la?$",
	"^cd$",
	"^cd \\.\\.$",
	"^cd -$",
	"^pwd$",
	"^z$",
	"^.{1,3}$",
]

[daemon]
enabled = true
autostart = true

[search]
filters = ["global", "workspace"]

[ui]
columns = ["exit", "duration", "time", "command"]

[ai]
enabled = false

[keymap.emacs]
"left" = [
	{ when = "cursor-at-start", action = "copy" },
	{ action = "cursor-left" },
]
